<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Duel Judge</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: url('{{ url_for('static', filename='img/floor_background.jpg') }}') center/cover no-repeat fixed;
            color: white;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 21, 0.7);
            backdrop-filter: blur(10px);
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(0, 149, 255, 0.8);
            margin-bottom: 2rem;
            letter-spacing: 4px;
        }

        .control-panel {
            display: flex;
            gap: 20px;
            margin-bottom: 2rem;
            align-items: center;
        }

        select {
            width: 250px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            padding: 0 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        select:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        select option {
            background: #1a1a2e;
            color: white;
        }

        .image-container {
            width: 100%;
            max-width: 500px; /* 从800px减小到500px */
            height: 300px; /* 添加固定高度 */
            margin: 2rem 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #questionImage {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 10px;
            display: block;
        }

        #answerText {
            font-size: 2.5rem;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            margin: 1.5rem 0;
            min-height: 60px;
            text-align: center;
        }

        .button-container {
            display: flex;
            gap: 40px;
            margin-top: 1rem;
        }

        button {
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 15px 40px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #startButton {
            background: linear-gradient(45deg, #4f46e5, #7c3aed);
            color: white;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
        }

        #startButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6);
        }

        #correctButton {
            background: linear-gradient(45deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        #correctButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
        }

        #passButton {
            background: linear-gradient(45deg, #ef4444, #dc2626);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        #passButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
        }

        @media (max-width: 768px) {
            .control-panel {
                flex-direction: column;
            }

            .button-container {
                flex-direction: column;
                gap: 20px;
            }

            .title {
                font-size: 2.5rem;
            }

            select, button {
                width: 100%;
                max-width: 300px;
            }

            .image-container {
                height: 200px; /* 移动端更小的高度 */
                padding: 10px;
                max-width: 300px; /* 移动端更小的宽度 */
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="title">DUEL JUDGE</h1>

    <div class="control-panel">
        <select id="categorySelect">
            <option value="bugs">Bugs</option>
            <option value="apps">Apps</option>
            <option value="landmarks">Landmarks</option>
            <option value="states">States</option>
            <option value="countries">Countries</option>
            <option value="space">Space</option>
            <option value="fruits">Fruits</option>
            <option value="vegetables">Vegetables</option>
            <option value="fast food">Fast Food</option>
            <option value="slogan">Slogan</option>
            <option value="human body">Human Body</option>
            <option value="clothing and accessory">Clothing & Accessory</option>
            <option value="shoes">Shoes</option>
            <option value="desserts">Desserts</option>
            <option value="tools">Tools</option>
            <option value="sports equipment">Sports Equipment</option>
            <option value="junk drawer items">Junk Drawer Items</option>
        </select>
        <button id="startButton" onclick="startCategory()">Start</button>
    </div>

    <div class="image-container">
        <img id="questionImage" src="{{ url_for('static', filename='img/not_started.png') }}" alt="Question Image">
    </div>

    <div id="answerText"></div>

    <div class="button-container">
        <button id="correctButton" onclick="submitStatus('CORRECT')">Correct</button>
        <button id="passButton" onclick="submitStatus('PASS')">Pass</button>
    </div>
</div>

<script src="{{ url_for('static', filename='js/duel_judge.js') }}"></script>
</body>
</html>
